# Builds the Windows download (the app with its own Python), tests it on Windows, and
# publishes it as a GitHub Release when its version (gameshelf/__init__.py) hasn't been
# released yet. So releasing = raise the version and push to main. Other pushes just
# build and test.
name: Build and release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "tools/rename.py"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_EMBED: "3.12.10"   # the bundled Python; bump RUNTIME_REV below when this changes
  RUNTIME_REV: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same minor version as the bundled Python (for wheels)

      - name: Check the version and name
        id: ver
        shell: pwsh
        run: |
          python tools/buildinfo.py | Tee-Object -Variable info
          if ($LASTEXITCODE) { throw "version check failed" }
          $info | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          $ver = ($info | Select-String '^version=(.*)').Matches[0].Groups[1].Value
          gh release view "v$ver" -R "${{ github.repository }}" *> $null
          $new = if ($LASTEXITCODE) { "true" } else { "false" }
          "publish=$new" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "Version $ver released already: $(-not [bool]::Parse($new))"
          $global:LASTEXITCODE = 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Assemble the app with its own Python
        shell: pwsh
        run: |
          $root = "build/${{ steps.ver.outputs.name }}"
          New-Item -ItemType Directory -Force "$root/runtime" | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYTHON_EMBED/python-$env:PYTHON_EMBED-embed-amd64.zip" -OutFile embed.zip
          Expand-Archive embed.zip "$root/runtime"
          # Where the bundled Python looks for code: its own library, add-ons, and the app folder.
          $pth = Get-ChildItem "$root/runtime/python*._pth"
          $zip = (Get-ChildItem "$root/runtime/python3*.zip").Name
          Set-Content $pth.FullName "$zip`r`n.`r`nLib\site-packages`r`n..`r`nimport site"
          python -m pip install --no-compile --disable-pip-version-check --target "$root/runtime/Lib/site-packages" pip howlongtobeatpy pystray pillow
          Set-Content "$root/runtime/RUNTIME_VERSION" "$env:PYTHON_EMBED-$env:RUNTIME_REV"
          Copy-Item -Recurse gameshelf "$root/gameshelf"
          Copy-Item README.md $root
          # The launcher, named after the app ("Start Sunbeam.bat"), with Windows line endings.
          $bat = (Get-Content -Raw launcher.bat) -replace "__APP__", "${{ steps.ver.outputs.name }}" -replace "__REPO__", "${{ steps.ver.outputs.repo }}"
          $bat = $bat -replace "(?<!`r)`n", "`r`n"
          [IO.File]::WriteAllText("$((Resolve-Path $root).Path)/Start ${{ steps.ver.outputs.name }}.bat", $bat)
          Get-ChildItem $root -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force

      - name: Test it on Windows
        shell: pwsh
        run: |
          $root = (Resolve-Path "build/${{ steps.ver.outputs.name }}").Path
          & "$root/runtime/python.exe" -c "import pystray, PIL, howlongtobeatpy, gameshelf; print('imports ok', gameshelf.__version__)"
          if ($LASTEXITCODE) { throw "imports failed" }
          $p = Start-Process "$root/runtime/python.exe" -ArgumentList "-m","gameshelf","--no-browser","--port","8790" -WorkingDirectory $root -PassThru
          Start-Sleep 8
          $d = Invoke-RestMethod http://127.0.0.1:8790/api/desktop
          if (-not $d.packaged) { throw "doesn't know it's the packaged version" }
          if ($d.version -ne "${{ steps.ver.outputs.version }}") { throw "wrong version $($d.version)" }
          Invoke-RestMethod http://127.0.0.1:8790/api/library | Out-Null
          $page = (Invoke-WebRequest http://127.0.0.1:8790/ -UseBasicParsing).Content
          if ($page -notmatch "<title>${{ steps.ver.outputs.name }}</title>") { throw "the page doesn't carry the app's name" }
          Stop-Process $p.Id
          # Shortcuts are made the way the app makes them.
          & "$root/runtime/python.exe" -c "from gameshelf import desktop; print(desktop.make_shortcuts(['desktop', 'startmenu']))"
          if ($LASTEXITCODE) { throw "shortcuts failed" }
          Start-Sleep 2
          Remove-Item -Recurse -Force "$root/data" -ErrorAction SilentlyContinue
          Get-ChildItem $root -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force

      - name: Check the app window (one window, reused)
        id: window
        shell: pwsh
        run: |
          $root = (Resolve-Path "build/${{ steps.ver.outputs.name }}").Path
          & "$root/runtime/python.exe" tools/ci_window_check.py $root
          if ($LASTEXITCODE) { throw "window check failed" }
          $rgb = (Get-Content "$root/titlebar.txt") -split ","
          Remove-Item "$root/titlebar.txt"
          "titlebar=$((($rgb | ForEach-Object { [int]$_ }) | Measure-Object -Sum).Sum)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          foreach ($i in 1..10) {
            Start-Sleep 2
            Remove-Item -Recurse -Force "$root/data" -ErrorAction SilentlyContinue
            if (-not (Test-Path "$root/data")) { break }
          }
          Get-ChildItem $root -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          if (Test-Path "$root/data") { throw "a data folder is left in the build" }

      - name: Title bar is dark (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "::notice::title bar brightness (r+g+b) ${{ steps.window.outputs.titlebar }}"
          if ([int]"${{ steps.window.outputs.titlebar }}" -gt 240) { throw "light title bar" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "build/${{ steps.ver.outputs.name }}" -DestinationPath "${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.version }}
          path: ${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.version }}.zip

      - name: Publish the release
        if: steps.ver.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $zip = "${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.version }}.zip"
          $title = "${{ steps.ver.outputs.name }} ${{ steps.ver.outputs.version }}"
          if (Test-Path RELEASE_NOTES.md) { gh release create $tag $zip --target "${{ github.sha }}" --title $title --notes-file RELEASE_NOTES.md }
          else { gh release create $tag $zip --target "${{ github.sha }}" --title $title --generate-notes }
